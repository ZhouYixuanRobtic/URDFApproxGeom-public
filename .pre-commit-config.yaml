# pre-commit hooks — run once per clone:
#   pip install pre-commit && pre-commit install
#
# CI enforces the same rules independently; this catches issues at commit time.

repos:
  # ---- generic file hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---- C++ formatting (uses project .clang-format) ----
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ["--style=file", "--fallback-style=none"]
        exclude: ^third_party/

  # ---- CMake formatting ----
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: ["--in-place"]

  # ---- Python formatting ----
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length=100"]

  # ---- commit message lint (conventional commits) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, perf, ci, style, build]

# Development docker-compose configuration.
# Start:  docker compose -f docker/docker-compose.yml up -d
# Shell:  docker exec -it spherized-dev bash
# Stop:   docker compose -f docker/docker-compose.yml down
#
# Uncomment the sections you need.

services:
  spherized-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spherized-dev
    image: urdfapprox-dev:latest
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    stdin_open: true
    tty: true
    network_mode: host

